name: Reset staging user password

on:
  workflow_dispatch:
    inputs:
      username:
        description: Existing FIP username to reset
        required: true
        default: admin
        type: string

permissions:
  contents: read

concurrency:
  group: fip-staging-password-reset
  cancel-in-progress: false

jobs:
  reset-password:
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIP_ENVIRONMENT: staging
      FIP_DATABASE_URL: ${{ secrets.FIP_DATABASE_URL }}
      FIP_JWT_SECRET: ${{ secrets.FIP_JWT_SECRET }}
      FIP_ADMIN_RESET_PASSWORD: ${{ secrets.FIP_ADMIN_RESET_PASSWORD }}
      FIP_ADMIN_RESET_USERNAME: ${{ inputs.username }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Validate reset request
        shell: bash
        run: |
          test -n "$FIP_DATABASE_URL"
          test -n "$FIP_JWT_SECRET"
          test -n "$FIP_ADMIN_RESET_USERNAME"
          test -n "$FIP_ADMIN_RESET_PASSWORD"
          test "${#FIP_ADMIN_RESET_PASSWORD}" -ge 16
      - name: Install locked API dependencies
        run: uv sync --project apps/api --locked
      - name: Reset existing user password
        run: |
          uv run --project apps/api python - <<'PY'
          import os

          from sqlalchemy import select

          from fip_api.core.security import hash_password
          from fip_api.db.session import SessionLocal
          from fip_api.models import User

          username = os.environ["FIP_ADMIN_RESET_USERNAME"].strip()
          password = os.environ["FIP_ADMIN_RESET_PASSWORD"]

          with SessionLocal() as db:
              user = db.scalar(select(User).where(User.username == username).with_for_update())
              if user is None:
                  raise SystemExit("Requested FIP user does not exist.")
              user.password_hash = hash_password(password)
              user.failed_login_attempts = 0
              user.locked_until = None
              user.is_active = True
              db.commit()

          print("FIP user password reset completed; temporary reset secret should now be deleted.")
          PY
