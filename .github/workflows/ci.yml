name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/mvp

permissions:
  contents: read

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fip_test
          POSTGRES_USER: fip
          POSTGRES_PASSWORD: fip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fip -d fip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIP_ENVIRONMENT: test
      FIP_DATABASE_URL: postgresql+psycopg://fip:fip@localhost:5432/fip_test
      FIP_JWT_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --project apps/api --all-groups --locked
      - run: uv run --project apps/api ruff check apps/api/src apps/api/tests apps/api/alembic
      - run: uv run --project apps/api ruff format --check apps/api/src apps/api/tests apps/api/alembic
      - run: uv run --project apps/api mypy apps/api/src
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - run: uv run --project apps/api pytest apps/api/tests --cov=fip_api --cov-report=term-missing --cov-fail-under=80

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
