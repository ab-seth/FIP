[project]
name = "fip-api"
version = "0.1.0"
description = "Financial Integrity and Fraud Intelligence Platform API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.19.0,<2.0",
  "fastapi>=0.141.1,<1.0",
  "psycopg[binary]>=3.3.4,<4.0",
  "pydantic-settings>=2.14.2,<3.0",
  "pwdlib[argon2]>=0.3.0,<1.0",
  "pyjwt>=2.13.0,<3.0",
  "sqlalchemy>=2.0.51,<3.0",
  "uvicorn[standard]>=0.52.1,<1.0",
]

[project.scripts]
fip-api-backfill-rule-assessments = "fip_api.backfill_assessments:main"
fip-api-bootstrap = "fip_api.bootstrap:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1.0",
  "mypy>=2.3.0,<3.0",
  "pytest>=9.1.1,<10.0",
  "pytest-cov>=7.1.0,<8.0",
  "ruff>=0.16.1,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fip_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pwdlib.*"]
ignore_missing_imports = true
