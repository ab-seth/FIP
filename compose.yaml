name: fip

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fip}
      POSTGRES_USER: ${POSTGRES_USER:-fip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fip}
    ports:
      - "5432:5432"
    volumes:
      - fip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fip} -d ${POSTGRES_DB:-fip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      FIP_ENVIRONMENT: ${FIP_ENVIRONMENT:-development}
      FIP_DATABASE_URL: ${FIP_DATABASE_URL:-postgresql+psycopg://fip:fip@db:5432/fip}
      FIP_JWT_SECRET: ${FIP_JWT_SECRET:-development-only-secret-change-before-use}
      FIP_ACCESS_TOKEN_MINUTES: ${FIP_ACCESS_TOKEN_MINUTES:-30}
      FIP_LOGIN_MAX_ATTEMPTS: ${FIP_LOGIN_MAX_ATTEMPTS:-3}
      FIP_LOGIN_LOCK_MINUTES: ${FIP_LOGIN_LOCK_MINUTES:-15}
      FIP_TRANSACTION_UPLOAD_MAX_BYTES: ${FIP_TRANSACTION_UPLOAD_MAX_BYTES:-10485760}
      FIP_TRANSACTION_UPLOAD_MAX_ROWS: ${FIP_TRANSACTION_UPLOAD_MAX_ROWS:-10000}
      FIP_MODEL_ARTIFACT_ROOT: ${FIP_MODEL_ARTIFACT_ROOT:-/var/lib/fip/model-artifacts}
      FIP_MODEL_ARTIFACT_MAX_BYTES: ${FIP_MODEL_ARTIFACT_MAX_BYTES:-268435456}
      FIP_TRAINING_ARTIFACT_ROOT: ${FIP_TRAINING_ARTIFACT_ROOT:-/var/lib/fip/training-artifacts}
      FIP_TRAINING_ARTIFACT_MAX_BYTES: ${FIP_TRAINING_ARTIFACT_MAX_BYTES:-268435456}
      FIP_LLM_ADAPTER: ${FIP_LLM_ADAPTER:-json-http}
      FIP_LLM_ENDPOINT: ${FIP_LLM_ENDPOINT:-}
      FIP_LLM_API_KEY: ${FIP_LLM_API_KEY:-${LM_API_TOKEN:-}}
      FIP_LLM_MODEL: ${FIP_LLM_MODEL:-}
      FIP_LLM_PROVIDER_NAME: ${FIP_LLM_PROVIDER_NAME:-json-http}
      FIP_LLM_TIMEOUT_SECONDS: ${FIP_LLM_TIMEOUT_SECONDS:-8}
      FIP_LLM_MAX_RESPONSE_BYTES: ${FIP_LLM_MAX_RESPONSE_BYTES:-262144}
      FIP_LLM_MAX_COMPLETION_TOKENS: ${FIP_LLM_MAX_COMPLETION_TOKENS:-1800}
      FIP_BOOTSTRAP_ADMIN_USERNAME: ${FIP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      FIP_BOOTSTRAP_ADMIN_PASSWORD: ${FIP_BOOTSTRAP_ADMIN_PASSWORD:-admin-change-me}
    command: ["sh", "-c", "alembic upgrade head && python -m fip_api.bootstrap && uvicorn fip_api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - fip_model_artifacts:/var/lib/fip/model-artifacts
      - fip_training_artifacts:/var/lib/fip/training-artifacts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  trainer:
    build:
      context: ./apps/api
    environment:
      FIP_ENVIRONMENT: ${FIP_ENVIRONMENT:-development}
      FIP_DATABASE_URL: ${FIP_DATABASE_URL:-postgresql+psycopg://fip:fip@db:5432/fip}
      FIP_JWT_SECRET: ${FIP_JWT_SECRET:-development-only-secret-change-before-use}
      FIP_TRAINING_ARTIFACT_ROOT: ${FIP_TRAINING_ARTIFACT_ROOT:-/var/lib/fip/training-artifacts}
      FIP_TRAINING_ARTIFACT_MAX_BYTES: ${FIP_TRAINING_ARTIFACT_MAX_BYTES:-268435456}
      FIP_TRAINING_WORKER_POLL_SECONDS: ${FIP_TRAINING_WORKER_POLL_SECONDS:-2}
      FIP_TRAINING_WORKER_LEASE_MINUTES: ${FIP_TRAINING_WORKER_LEASE_MINUTES:-360}
    command: ["fip-training-worker"]
    volumes:
      - fip_training_artifacts:/var/lib/fip/training-artifacts
    depends_on:
      api:
        condition: service_healthy

  benchmark:
    build:
      context: ./apps/api
    environment:
      FIP_ENVIRONMENT: ${FIP_ENVIRONMENT:-development}
      FIP_DATABASE_URL: ${FIP_DATABASE_URL:-postgresql+psycopg://fip:fip@db:5432/fip}
      FIP_JWT_SECRET: ${FIP_JWT_SECRET:-development-only-secret-change-before-use}
      FIP_BENCHMARK_WORKER_POLL_SECONDS: ${FIP_BENCHMARK_WORKER_POLL_SECONDS:-2}
      FIP_BENCHMARK_WORKER_LEASE_MINUTES: ${FIP_BENCHMARK_WORKER_LEASE_MINUTES:-360}
    command: ["fip-benchmark-worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      FIP_API_URL: http://api:8000
      FIP_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  fip_model_artifacts:
  fip_postgres_data:
  fip_training_artifacts:
